apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-deployment
  namespace: appointments
  labels:
    app: appointment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment
  template:
    metadata:
      labels:
        app: appointment
    spec:
      containers:
      - name: appointment
        image: 399817749711.dkr.ecr.us-east-1.amazonaws.com/dev-appointment:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: appointments
spec:
  selector:
    app: appointment
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP
